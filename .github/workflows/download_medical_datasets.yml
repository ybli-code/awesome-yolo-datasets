name: Download Medical Datasets (UCSF-PDGM & UPENN-GBM)

# 触发方式：手动触发（Actions 页面点击 Run workflow）
on:
  workflow_dispatch:
    inputs:
      dataset:
        description: '选择要下载的数据集'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - ucsf-pdgm
          - upenn-gbm
      skip_dwi:
        description: '跳过DWI大文件(.sz/.gqi.fz/.qsdr.fz)，仅下载结构像+分割标签（更快更省空间）'
        required: false
        default: true
        type: boolean
      upload_baidu:
        description: '下载完成后上传到百度网盘并创建分享链接'
        required: false
        default: true
        type: boolean

# 环境变量
env:
  PYTHONUNBUFFERED: '1'
  WORK_DIR: '/mnt'  # 使用 /mnt 资源盘（额外14GB空间）

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 最大6小时

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 彻底释放磁盘空间（删除所有不必要的预装软件）
        run: |
          echo "=== 释放前磁盘空间 ==="
          df -h /
          df -h /mnt
          echo ""
          
          echo "删除 Android SDK (~12GB)..."
          sudo rm -rf /usr/local/lib/android || true
          
          echo "删除 .NET 运行时 (~2GB)..."
          sudo rm -rf /usr/share/dotnet || true
          
          echo "删除 Docker 镜像和数据 (~5GB)..."
          docker image prune -a -f || true
          sudo systemctl stop docker || true
          sudo rm -rf /var/lib/docker || true
          sudo rm -rf /opt/hostedtoolcache || true
          
          echo "删除 Swift 运行时 (~2GB)..."
          sudo rm -rf /usr/share/swift || true
          
          echo "删除 Google Cloud SDK (~1GB)..."
          sudo rm -rf /usr/local/lib/google-cloud-sdk || true
          
          echo "删除 Firefox / Chrome..."
          sudo rm -rf /usr/lib/firefox || true
          sudo rm -rf /opt/google/chrome || true
          
          echo "删除 Azure CLI / Powershell / 其他工具..."
          sudo rm -rf /opt/az || true
          sudo rm -rf /opt/microsoft || true
          sudo rm -rf /usr/local/share/chromium || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /usr/local/share/edge_driver || true
          
          echo "删除 apt 缓存..."
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* || true
          
          echo "删除 npm 缓存..."
          sudo rm -rf /usr/local/share/.cache || true
          
          echo ""
          echo "=== 释放后磁盘空间 ==="
          df -h /
          df -h /mnt
          echo ""
          echo "=== /mnt 目录权限 ==="
          sudo chmod 777 /mnt || true
          ls -la /mnt

      - name: 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests
          python --version

      - name: 构建下载参数
        id: params
        run: |
          DATASET="${{ github.event.inputs.dataset }}"
          SKIP_DWI="${{ github.event.inputs.skip_dwi }}"
          UPLOAD_BAIDU="${{ github.event.inputs.upload_baidu }}"

          CMD="python scripts/medical_dataset_pipeline.py --dataset $DATASET"
          
          if [ "$SKIP_DWI" = "true" ]; then
            CMD="$CMD --skip-dwi"
          fi

          if [ "$UPLOAD_BAIDU" = "false" ]; then
            CMD="$CMD --skip-upload"
          fi

          echo "cmd=$CMD" >> $GITHUB_OUTPUT
          echo "执行命令: $CMD"

      - name: 下载并整理医学影像数据集（流式处理：下载一个→上传→删除→下一个）
        env:
          BAIDU_ACCESS_TOKEN: ${{ secrets.BAIDU_ACCESS_TOKEN }}
          BAIDU_BDUSS: ${{ secrets.BAIDU_BDUSS }}
          BAIDU_APP_ID: '266719'
          WORK_DIR: '/mnt'
        run: |
          echo "=== 开始下载 ==="
          echo "数据集: ${{ github.event.inputs.dataset }}"
          echo "跳过DWI: ${{ github.event.inputs.skip_dwi }}"
          echo "上传百度网盘: ${{ github.event.inputs.upload_baidu }}"
          echo "工作目录: /mnt/medical_datasets"
          echo ""
          
          # 确保 /mnt 可写
          sudo chmod 777 /mnt || true
          
          ${{ steps.params.outputs.cmd }}
          
          echo ""
          echo "=== 下载完成 ==="
          echo "输出目录内容:"
          ls -la /mnt/medical_datasets/ 2>/dev/null || echo "目录不存在"
          echo ""
          echo "打包文件:"
          ls -lh /mnt/medical_datasets/packages/ 2>/dev/null || echo "无打包文件"
          echo ""
          echo "结果文件:"
          cat /mnt/medical_datasets/download_results.json 2>/dev/null || echo "无结果文件"
          
          # 将结果文件复制到工作目录（用于 Artifact 上传）
          cp /mnt/medical_datasets/download_results.json medical_datasets_results.json 2>/dev/null || true

      - name: 上传下载结果为 Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: download-results
          path: |
            medical_datasets_results.json
          retention-days: 7
          if-no-files-found: ignore

      - name: 输出百度网盘分享链接
        if: always()
        run: |
          echo "## 下载结果汇总" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f medical_datasets_results.json ]; then
            echo "### 百度网盘分享链接" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            python3 -c "
          import json
          with open('medical_datasets_results.json') as f:
              data = json.load(f)
          for name, info in data.items():
              print(f'**{name}**')
              print(f'- 本地包: {info.get(\"package\", \"N/A\")}')
              if 'share_link' in info:
                  print(f'- 百度网盘: {info[\"share_link\"]}')
                  print(f'- 提取码: {info.get(\"password\", \"yolo\")}')
              elif 'error' in info:
                  print(f'- 状态: {info[\"error\"]}')
              else:
                  print(f'- 状态: 跳过上传')
              print()
          " >> $GITHUB_STEP_SUMMARY
          else
            echo "未生成结果文件，请查看上方日志。" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 磁盘使用情况" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          df -h / >> $GITHUB_STEP_SUMMARY
          df -h /mnt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
