name: Preview Extract
on:
  workflow_dispatch:
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Preview Extract
        run: |
          python scripts/preview_extract.py
      - name: Upload Samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-samples
          path: /tmp/dataset_downloads/
          retention-days: 3
