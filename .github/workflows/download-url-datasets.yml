name: Download URL Datasets to Netdisk

on:
  workflow_dispatch:
    inputs:
      limit:
        description: '处理数量限制 (0=全部)'
        required: false
        default: '0'
      relay:
        description: '发布链路: 0=Runner直传夸克(默认,推荐,不经T4) 1=传GitHub Release由T4中转(T4已停摆,勿用)'
        required: false
        default: '0'

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx

      - name: Run Download Script
        env:
          BAIDU_ACCESS_TOKEN: ${{ secrets.BAIDU_ACCESS_TOKEN }}
          QUARK_COOKIE: ${{ secrets.QUARK_COOKIE }}
          TENCENT_TOKEN: ${{ secrets.TENCENT_TOKEN }}
          FILE_ID: ${{ secrets.FILE_ID }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          RELAY_MODE: ${{ github.event.inputs.relay || '0' }}
          GH_RELAY_TOKEN: ${{ github.token }}
        run: |
          echo "开始下载通用URL数据集..."
          echo "网盘后端: ${{ secrets.QUARK_COOKIE != '' && '夸克网盘' || '百度网盘' }}"
          echo "发布链路: ${{ github.event.inputs.relay || '0' }}"
          python scripts/download_url.py
          echo "下载完成"

      - name: Upload Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: download-url-log
          path: |
            /tmp/dataset_downloads/
          retention-days: 7
